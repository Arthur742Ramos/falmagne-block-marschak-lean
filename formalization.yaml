fidelity:
  divergences: >-
    None in the main finite strict-ranking theorem. Equivalent complete Nodup
    lists represent strict rankings; probability laws use finitely supported
    real weights. Empty-menu and off-menu zero values are explicit bookkeeping.
    Singleton alternatives are included. The constructive local flow proof
    replaces a citation to general flow decomposition.
