version: "v0.4"
project:
  name: "Falmagne–Block–Marschak Random-Utility Characterization"
  description: >-
    A full constructive formalization of the Falmagne–Block–Marschak theorem
    for any finite nonempty alternative set, without a cardinality bound.
    A normalized stochastic choice rule on all nonempty menus is generated
    by a single probability distribution over complete strict rankings if
    and only if all Block–Marschak alternating-sum coefficients are nonnegative.
    The proof derives Boolean-lattice flow conservation, constructs a finite
    ranking mixture by positive-path subtraction, and proves exact lower-contour
    probability identities by Möbius inversion. Compiled adversarial examples
    show that regularity alone is insufficient.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy Jose Guerra Barretto de Queiroz"
  responsible_maintainers:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"
classification:
  arxiv: ["econ.TH", "math.CO"]
  msc2020: ["91B08", "91B16"]
sources:
  - title: "A representation theorem for finite random scale systems"
    authors: ["Jean-Claude Falmagne"]
    type: paper
    id: "https://doi.org/10.1016/0022-2496(78)90048-2"
    location: "Journal of Mathematical Psychology 18 (1978), 52–72"
    relationship: formalizes
    note: "The classical full finite random-utility representation theorem; no mathematical novelty claim."
    author_endorsement: not-contacted
  - title: "A short proof of a theorem of Falmagne"
    authors: ["Samuel Fiorini"]
    type: paper
    id: "https://doi.org/10.1016/j.jmp.2003.11.003"
    relationship: adapts
    note: "Boolean Möbius inversion and the subset-network flow approach; the flow decomposition is proved locally."
    author_endorsement: not-contacted
  - title: "Adjacencies on random ordering polytopes and flow polytopes"
    authors: ["Jean-Paul Doignon", "Kota Saito"]
    type: paper
    id: "https://saito.caltech.edu/documents/29716/Adjacencies_arxiv.pdf"
    relationship: background
    note: "Primary research exposition, section 3 equations 13–21 and preceding acyclic flow theorem."
    author_endorsement: not-contacted
status:
  scope: >-
    The full finite arbitrary-cardinality strict-ranking characterization on all
    nonempty menus. Rankings are complete Nodup best-to-worst lists and the same
    finitely supported nonnegative mass-one law reproduces every menu. The empty
    menu is zero bookkeeping. This is the standard no-ties random-utility scope,
    not unrestricted menu-dependent tie breaking. No representation or flow
    decomposition premise is included in the theorem assumptions.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
